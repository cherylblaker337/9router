name: build-9router
on:
  schedule: [{ cron: "0 */6 * * *" }]
  push:
    paths:
      - "patches/**"
      - ".github/workflows/build-9router.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if tag+fingerprint already exists"
        type: boolean
        default: false
      simulate_failure:
        description: "Fail on purpose (test the failure notification)"
        type: boolean
        default: false
concurrency:
  group: build-9router
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
jobs:
  build:
    # Native runners per arch (NO QEMU): amd64 on ubuntu-latest, arm64 on ubuntu-24.04-arm.
    # QEMU-emulated arm64 was unusably slow (a full next build + native deps hung for hours).
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Simulate failure (test only)
        if: ${{ inputs.simulate_failure }}
        run: |
          echo "::error::simulated failure to test the failure notification"
          exit 1
      - name: Resolve latest stable upstream tag + patch fingerprint + lowercase owner
        run: |
          UP=$(git ls-remote --tags https://github.com/decolua/9router.git 'refs/tags/v*' \
               | grep -v '\^{}' | awk -F/ '{print $3}' \
               | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          if [ -z "$UP" ]; then echo "::error::no stable tag found"; exit 1; fi
          echo "UPSTREAM_TAG=$UP" >> "$GITHUB_ENV"
          echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          FP=$(cat patches/*.patch 2>/dev/null | sha256sum | cut -c1-8)
          [ -z "$FP" ] && FP=nopatch
          echo "PATCH_FP=$FP" >> "$GITHUB_ENV"
          echo "resolved tag=$UP fingerprint=$FP arch=${{ matrix.arch }}"
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Skip if this arch is already built
        if: ${{ !inputs.force }}
        run: |
          if docker manifest inspect ghcr.io/${{ env.OWNER }}/9router:${{ env.UPSTREAM_TAG }}-${{ env.PATCH_FP }}-${{ matrix.arch }} >/dev/null 2>&1; then
            echo "already built"; echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - name: Fetch upstream source (full history for git apply -3)
        if: env.SKIP != '1'
        run: git clone --branch "${{ env.UPSTREAM_TAG }}" https://github.com/decolua/9router.git build-src
      - name: Apply patches (probe-first tri-state)
        if: env.SKIP != '1'
        run: |
          cd build-src
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          APPLIED=""
          # apply_patch <patch> <file:pattern>... <label>
          apply_patch() {
            local P="$1"; shift
            local T="${@: -1}"; local probes=("${@:1:$#-1}")
            local allhit=1
            for pr in "${probes[@]}"; do
              local f="${pr%%:*}"; local s="${pr#*:}"
              if ! grep -qF "$s" "$f" 2>/dev/null; then allhit=0; fi
            done
            if [ "$allhit" = 1 ]; then echo "::warning::$T already fixed (probe)"; return; fi
            local before; before=$(git status --porcelain | sha256sum)
            if git apply -3 "$P" 2>/dev/null; then
              local after; after=$(git status --porcelain | sha256sum)
              if [ "$before" = "$after" ]; then echo "::error::$T no change and no probe"; exit 1; fi
              APPLIED="${APPLIED}${APPLIED:+,}$T"
              echo "applied: $T"
            else
              echo "::error::$T patch conflict"; git apply -3 "$P" || true; exit 1
            fi
          }
          apply_patch ../patches/9router-perf.patch 'open-sse/utils/stream.js:SSE_COALESCE_MS' 9router-perf-1
          apply_patch ../patches/9router-opencode-freetier.patch \
            'open-sse/executors/opencode.js:9router-patch] oc-freetier' \
            'open-sse/executors/opencode-zen.js:9router-patch] oc-freetier' \
            oc-freetier-1
          apply_patch ../patches/9router-opencode-inference.patch \
            'open-sse/utils/opencodeOfficialTools.js:OPENCODE_OFFICIAL_TOOLS' \
            oc-inference-1
          echo "PATCH_APPLIED=$APPLIED" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
        if: env.SKIP != '1'
      - name: Build & push (${{ matrix.arch }})
        if: env.SKIP != '1'
        env:
          PATCH_APPLIED: ${{ env.PATCH_APPLIED }}
          UPSTREAM_TAG: ${{ env.UPSTREAM_TAG }}
          PATCH_FP: ${{ env.PATCH_FP }}
          OWNER: ${{ env.OWNER }}
        run: |
          IMG=ghcr.io/$OWNER/9router
          LABELS="--label org.opencontainers.image.version=$UPSTREAM_TAG --label org.9router.patch.fingerprint=$PATCH_FP"
          if [ -n "$PATCH_APPLIED" ]; then LABELS="$LABELS --label org.9router.patch=$PATCH_APPLIED"; fi
          docker buildx build --platform ${{ matrix.platform }} \
            -t "$IMG:$UPSTREAM_TAG-$PATCH_FP-${{ matrix.arch }}" $LABELS --push build-src
  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve latest stable upstream tag + patch fingerprint + lowercase owner
        run: |
          UP=$(git ls-remote --tags https://github.com/decolua/9router.git 'refs/tags/v*' \
               | grep -v '\^{}' | awk -F/ '{print $3}' \
               | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          echo "UPSTREAM_TAG=$UP" >> "$GITHUB_ENV"
          echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          FP=$(cat patches/*.patch 2>/dev/null | sha256sum | cut -c1-8)
          [ -z "$FP" ] && FP=nopatch
          echo "PATCH_FP=$FP" >> "$GITHUB_ENV"
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Merge multi-arch manifest (:tag, :tag-fp, :latest)
        run: |
          IMG=ghcr.io/$OWNER/9router
          docker buildx imagetools create \
            -t "$IMG:$UPSTREAM_TAG" \
            -t "$IMG:$UPSTREAM_TAG-$PATCH_FP" \
            -t "$IMG:latest" \
            "$IMG:$UPSTREAM_TAG-$PATCH_FP-amd64" \
            "$IMG:$UPSTREAM_TAG-$PATCH_FP-arm64"
          echo "merged manifest for $UPSTREAM_TAG (fp=$PATCH_FP)"
      - name: Notify (failure)
        if: failure()
        env:
          WEBHOOK: ${{ secrets.MATTERMOST_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "no MATTERMOST_WEBHOOK secret; skip"; exit 0; fi
          TEXT=":x: **9router 补丁镜像构建失败**（补丁冲突或构建错误，详见 run 日志） · tag=${UPSTREAM_TAG:-?} · [查看 run](${RUN_URL})"
          jq -n --arg t "$TEXT" '{text:$t}' | curl -sS --max-time 10 -X POST -H 'Content-Type: application/json' -d @- "$WEBHOOK" || true
      - name: Notify (success/new image)
        if: success()
        env:
          WEBHOOK: ${{ secrets.MATTERMOST_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "no MATTERMOST_WEBHOOK secret; skip"; exit 0; fi
          TEXT=":white_check_mark: **9router 补丁镜像已发布** · tag=${UPSTREAM_TAG:-?} · fp=${PATCH_FP:-?} · [查看 run](${RUN_URL})"
          jq -n --arg t "$TEXT" '{text:$t}' | curl -sS --max-time 10 -X POST -H 'Content-Type: application/json' -d @- "$WEBHOOK" || true
